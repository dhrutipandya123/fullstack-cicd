
services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: fullstack-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/fullstackdb
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: fullstack-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8082:80"
    networks:
      - app-network

volumes:
  mongodb_data:

networks:
  app-network:
    driver: bridge
